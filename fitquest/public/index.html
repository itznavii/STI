<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{
--bg:#FFFAF5;--surface:#FFFFFF;--surface2:#F7F0E8;--border:#EBDFD2;--text:#231C18;--muted:#7C7169;
--xp:#EE4F27;--xp-dim:#FFE9E1;--xp-ink:#B8371A;
--rp:#1F9E86;--rp-dim:#DDF4EE;--rp-ink:#14705E;
--danger:#D93B40;--danger-dim:#FDE6E6;
--ok:#1F9E5A;--ok-dim:#DFF4E7;
--pending:#C98510;--pending-dim:#FFF1D6;
--font-d:'Plus Jakarta Sans',system-ui,sans-serif;--font-b:'Plus Jakarta Sans',system-ui,sans-serif;
--radius:18px;--shadow:0 1px 2px rgba(60,35,15,.05),0 6px 20px rgba(60,35,15,.06);}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{background:var(--bg);color:var(--text);font-family:var(--font-b);font-size:15px;line-height:1.5;min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:var(--font-d);font-weight:800;letter-spacing:-.02em;line-height:1.15;}
h2{font-size:1.5rem}h3{font-size:1.1rem;font-weight:700}
button,input,select,textarea{font-family:var(--font-b);}
:focus-visible{outline:3px solid rgba(238,79,39,.35);outline-offset:2px;}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px 96px;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:rgba(255,250,245,.92);backdrop-filter:blur(12px);position:sticky;top:0;z-index:50;border-bottom:1px solid var(--border);}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem;letter-spacing:-.03em}
.brand .accent{color:var(--xp)}
.logo{width:34px;height:34px;border-radius:11px;background:var(--xp);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.btn{background:var(--surface);color:var(--text);border:1.5px solid var(--border);border-radius:999px;padding:10px 18px;font-weight:700;font-size:.88rem;cursor:pointer;transition:transform .12s,box-shadow .12s,background .12s;}
.btn:hover{background:var(--surface2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--xp);color:#fff;border-color:var(--xp);box-shadow:0 4px 12px rgba(238,79,39,.25)}
.btn.primary:hover{background:#D94420}
.btn.violet{background:var(--rp);color:#fff;border-color:var(--rp);box-shadow:0 4px 12px rgba(31,158,134,.25)}

.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.small{padding:7px 14px;font-size:.8rem}

input,select,textarea{width:100%;background:var(--surface);border:1.5px solid var(--border);color:var(--text);border-radius:14px;padding:12px 14px;font-size:.95rem;transition:border-color .15s,box-shadow .15s}

.field{margin-bottom:14px}
.field label{display:block;font-size:.82rem;font-weight:600;color:var(--text);margin-bottom:6px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.pill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:.75rem;font-weight:700;}
.pill.xp{background:var(--xp-dim);color:var(--xp-ink)}
.pill.rp{background:var(--rp-dim);color:var(--rp-ink)}
.pill.ok{background:var(--ok-dim);color:#14703D}
.pill.pending{background:var(--pending-dim);color:#8A5A05}
.pill.rej{background:var(--danger-dim);color:#A62328}
.bar{height:12px;background:var(--surface2);border-radius:999px;overflow:hidden;margin-top:8px}
.bar>div{height:100%;background:linear-gradient(90deg,#FF8A5C,var(--xp));border-radius:999px;transition:width .5s ease}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none;max-width:1040px;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 18px;font-size:.88rem;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;border-radius:999px;background:transparent;transition:background .15s,color .15s}
.tab:hover{background:var(--surface2);color:var(--text)}
.tab.active{background:var(--text);color:#fff}
.view{display:none}.view.active{display:block;animation:fade .25s ease}

.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-bg{position:fixed;inset:0;background:rgba(35,28,24,.45);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:150;padding:16px}

.row{display:flex;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:.85rem}
.notif-dot{width:9px;height:9px;background:var(--xp);border:2px solid #fff;border-radius:50%;position:absolute;top:4px;right:4px}
a.link{color:var(--xp);cursor:pointer;font-size:.88rem;font-weight:700;}
a.link:hover{text-decoration:underline}

.topbar .row{flex-wrap:nowrap;flex-shrink:0}
#whoami{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.userchip{display:inline-flex;align-items:center;gap:8px;background:transparent;border:3px solid transparent;border-radius:10px;padding:2px 8px 2px 2px;cursor:pointer;color:inherit;font:inherit;transition:background .15s,border-color .15s,transform .1s}

  .logo{width:30px;height:30px;border-radius:9px}
  .wrap{padding:18px 12px 90px}
  .authhero{padding:24px 20px}
  .authbox{padding:24px 20px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
let db=null, me=null, unsub=[], token=null, APP_TZ='UTC';

// ---- REMOTE DATABASE CLIENT ----
// Talks to this app's own backend (server.js), which persists everything
// to a real database file on disk (data/db.json). Same doc/collection
// query API as before, so nothing else in this file needs to change.
function createRemoteDB(){
  const enc=encodeURIComponent;
  async function apiQuery(coll,wheres,orderByField,orderByDir,limitN){
    return api('GET',`/api/collection/${enc(coll)}?query=${enc(JSON.stringify({wheres,orderByField,orderByDir,limitN}))}`);
  }
  function makeDocSnap(coll,id,data){
    const has = data!==undefined && data!==null;
    return { id, exists: has, data:()=> has?JSON.parse(JSON.stringify(data)):undefined };
  }
  class Query{
    constructor(path){ this.path=path; this.wheres=[]; this.orderByField=null; this.orderByDir='asc'; this.limitN=null; }
    where(f,op,v){ this.wheres.push([f,op,v]); return this; }
    orderBy(f,dir='asc'){ this.orderByField=f; this.orderByDir=dir; return this; }
    limit(n){ this.limitN=n; return this; }
    async get(){
      const res = await apiQuery(this.path,this.wheres,this.orderByField,this.orderByDir,this.limitN);
      const docs = res.docs.map(d=>makeDocSnap(this.path,d.id,d.data));
      return { docs, size:docs.length, empty:docs.length===0 };
    }
    onSnapshot(cb){
      // Polls (no push channel). Slow on purpose: every poll is a function call. Pauses while the tab is hidden.
      let stopped=false, lastJson=null;
      const poll=async()=>{
        if(stopped) return;
        if(!document.hidden){
          try{
            const res = await apiQuery(this.path,this.wheres,this.orderByField,this.orderByDir,this.limitN);
            const j = JSON.stringify(res.docs);
            if(!stopped && j!==lastJson){ lastJson=j; cb({ docs: res.docs.map(d=>makeDocSnap(this.path,d.id,d.data)), size:res.docs.length, empty:res.docs.length===0 }); }
          }catch(e){ /* offline or server hiccup — try again next tick */ }
        }
        if(!stopped) setTimeout(poll,20000);
      };
      poll();
      return ()=>{ stopped=true; };
    }
  }
  function splitPath(p){ const i=p.indexOf('/'); return [p.slice(0,i), p.slice(i+1)]; }
  return {
    doc(path){
      const [coll,id]=splitPath(path);
      const url=`/api/doc/${enc(coll)}/${enc(id)}`;
      return {
        get: async()=>{ const r=await api('GET',url); return makeDocSnap(coll,id, r.exists?r.data:undefined); },
        // staff-only catalogue writes (quests / rewards); the server rejects anything else
        set: async(data)=>{ await api('PUT',url,data); },
        update: async(patch)=>{ await api('PATCH',url,patch); },
        delete: async()=>{ await api('DELETE',url); },
      };
    },
    collection(path){ return new Query(path); }
  };
}


const ACH=[
  {id:'first_workout',name:'First Workout',icon:'medal',color:'#FF6B4A',check:s=>s.completions>=1},
  {id:'first_checkin',name:'First Check-In',icon:'check',color:'#2FA88F',check:s=>s.checkins>=1},

];

// ---- ICON SYSTEM (replaces emoji with a consistent line-icon set) ----
const ICON_PATHS = {
  bell: '<path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/>',
  flame: '<path d="M12 21.5c4 0 6.2-2.8 6.2-6.3 0-4.5-5.4-5.6-4.4-11.7-4.6 2.8-7.5 6.7-7.5 11.7 0 3.5 2.8 6.3 5.7 6.3Z"/><path d="M12 21.5c1.7 0 2.8-1.3 2.8-3 0-1.9-1.8-2.4-1.6-5-2 1.7-3.2 3.6-3.2 5.6 0 1.6 1 2.4 2 2.4Z"/>',
  check: '<circle cx="12" cy="12" r="9"/><path d="M8.3 12.3l2.4 2.4 4.7-5"/>',

  star: '<path d="M12 3l2.5 5.9 6.3.6-4.8 4.2 1.4 6.2L12 16.8 6.6 19.9 8 13.7 3.2 9.5l6.3-.6Z"/>',
  trophy: '<path d="M8 4h8v4.5a4 4 0 0 1-8 0Z"/><path d="M8 5.2H5.3a2.8 2.8 0 0 0 2.9 4.6M16 5.2h2.7a2.8 2.8 0 0 1-2.9 4.6"/><path d="M10.5 14.8h3v3h-3z"/><path d="M8 20.5h8"/>',
  users: '<circle cx="9" cy="8.3" r="3"/><path d="M3.2 19.5c.3-3 2.8-5 5.8-5s5.5 2 5.8 5"/><circle cx="17.2" cy="9.3" r="2.3"/><path d="M15.3 19.5c.2-2.2 1.7-3.8 3.3-4.2"/>',
  gift: '<rect x="4" y="10.5" width="16" height="9.5" rx="1.2"/><path d="M4 10.5h16"/><path d="M12 10.5v9.5"/><path d="M12 10.5c-1.8-4-7.3-3.8-7.3-1s4 1.3 7.3 1c3.3.3 7.3-.2 7.3-1s-5.5-3-7.3 1Z"/>',
  crown: '<path d="M4.5 17.5h15l-1.1-8-3.9 3-2.5-6-2.5 6-3.9-3Z"/><path d="M4.5 17.5v2.3h15v-2.3"/>',
  towel: '<rect x="5" y="4" width="14" height="16" rx="2"/><path d="M9.3 4v16M13.7 4v16" opacity=".45"/>',
  bottle: '<path d="M10.2 3h3.6v2.1l1.1 2.1V19a2 2 0 0 1-2 2h-1.8a2 2 0 0 1-2-2V7.2l1.1-2.1Z"/><path d="M9 12.5h6"/>',
  band: '<path d="M12 4.5c-5 0-8 3.2-8 7.5s3 7.5 8 7.5 8-3.2 8-7.5"/><path d="M12 8.3c-2.6 0-4.2 1.5-4.2 3.7s1.6 3.7 4.2 3.7 4.2-1.5 4.2-3.7"/>',
  cap: '<path d="M4.2 14.2c0-4.2 3.6-7.2 7.8-7.2s7.8 3 7.8 7.2"/><path d="M4.2 14.2h15.6"/><path d="M12 7V4"/><rect x="8.8" y="14.2" width="10.4" height="3" rx="1"/>',
  shirt: '<path d="M8.3 4 4.2 8.1l2.9 2.9 1-1V21h7.8V10l1 1 2.9-2.9L15.7 4l-2 2h-3.4Z"/>',
  percent: '<circle cx="7.3" cy="7.3" r="2.4"/><circle cx="16.7" cy="16.7" r="2.4"/><path d="M17.5 6.5 6.5 17.5"/>',

function svgIcon(name,size){
  size = size||20;
  const path = ICON_PATHS[name]||ICON_PATHS.circleoutline;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="display:block">${path}</svg>`;
}
function iconBadge(name,color,size){
  size = size||40;
  const iconSize = Math.round(size*0.52);
  return `<span style="display:inline-flex;align-items:center;justify-content:center;width:${size}px;height:${size}px;border-radius:${Math.round(size*0.32)}px;background:${color}1A;color:${color};flex-shrink:0">${svgIcon(name,iconSize)}</span>`;
}
const REWARD_ICON = {
  'Portable Mini Towel':['towel','#4A7CFF'], 'Shake Bottle':['bottle','#2FA88F'], 'Resistance Band':['band','#FF6B4A'],
  'FitQuest Cap':['cap','#C77DFF'], 'FitQuest Shirt':['shirt','#EC5E8A'],
  '10% Membership Discount':['percent','#E8A23D'], '20% Membership Discount':['percent','#E8A23D'],
};
function rewardImage(name){ let k=0; for(const c of name) k+=c.charCodeAt(0); return `<div class="rimg"><img src="/img/gift${k%2+1}.png" alt=""></div>`; }
function todayIso(){ return dateIso(Date.now()); }
function dateIso(ts){
  try{ return new Intl.DateTimeFormat('en-CA',{timeZone:APP_TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(ts); }
  catch(e){ return new Date(ts).toISOString().slice(0,10); }
}







async function checkIn(){
  await run(async()=>{
    const r=await api('POST','/api/checkin');

async function init(){

  try{ applySession(await api('GET','/api/auth/me')); enterApp(); }

// ======== FQ 8-BIT: avatars, rank, badges, profile, leaderboards ========
const IMG='/img/';
function avatarFor(u,id){ if(u&&['av1','av2','av3'].includes(u.avatar)) return IMG+u.avatar+'.png'; let h=0; String(id||(u&&u.email)||'x').split('').forEach(c=>{h=(h*31+c.charCodeAt(0))>>>0;}); return IMG+['av1','av2','av3'][h%3]+'.png'; }
const RANKS=[
  {id:'beginner',name:'Beginner',months:0,label:'1 month'},
  {id:'rookie',name:'Rookie',months:3,label:'3 months'},
  {id:'active',name:'Active',months:12,label:'12 months'},
  {id:'hero',name:'FitQuest Hero',months:24,label:'24 months and above'}];
function rankInfo(u){
  const start=u.membershipStart||u.createdAt||Date.now();
  const months=Math.max(0,Math.floor((Date.now()-start)/(30.44*86400000)));
  let i=0; RANKS.forEach((r,k)=>{ if(months>=r.months) i=k; });
  const next=RANKS[i+1]||null;
  return {rank:RANKS[i],index:i,months,next,left:next?next.months-months:0,pct:next?Math.round((months-RANKS[i].months)/(next.months-RANKS[i].months)*100):100};
}
const RANK_ICON={beginner:'rank_0',rookie:'medal2',active:'rank_1',hero:'trophy'}; // a different picture for each rank
function rankBadge(r,size){ size=size||30; return `<img class="rb r-${r.id}" src="${IMG}${RANK_ICON[r.id]||'rank_0'}.png" width="${size}" height="${size}" alt="${r.name}">`; }
function rankChip(u){ const r=rankInfo(u).rank; return `<span class="rankchip">${rankBadge(r,24)}<span>${r.name}</span></span>`; }
function achSprite(a,size){
  const m={medal:'ribbon',check:'heart',flame:'rank_0',dumbbell:'rank_1',star:'coin',trophy:'trophy',users:'gift1',gift:'gift2',crown:'trophy'};
  return `<img src="${IMG}${m[a.icon]||'ribbon'}.png" style="height:${size||56}px;width:auto;image-rendering:pixelated" alt="">`;
}
function dateStr(t){ return new Date(t).toLocaleDateString(); }

const GOALS=['Build strength','Lose weight','Improve cardio','Get more flexible','Stay active'];

function lbName(u,id){ if(me&&me.role==='staff') return u.name; if(u.hideOnBoard&&id!==me.id) return 'Hidden hero'; return u.nickname||u.name; }
async function profileData(userId,u){
  const wk=Date.now()-7*86400000;
  const [a,c,k,xp,qs,rw,tm]=await Promise.all([
    db.collection('member_achievements').where('userId','==',userId).get(),
    db.collection('completions').where('userId','==',userId).where('status','==','approved').get(),
    db.collection('checkins').where('userId','==',userId).get(),
    db.collection('xp_tx').where('userId','==',userId).where('createdAt','>=',wk).get(),
    db.collection('quests').get(),
    db.collection('rewards').where('active','==',true).get(),
    db.collection('team_ups').where('memberIds','array-contains',userId).get()]);
  const cat={}; qs.docs.forEach(d=>cat[d.id]=d.data().category);
  const mix={}; c.docs.forEach(d=>{const n=cat[d.data().questId]||'Other'; mix[n]=(mix[n]||0)+1;});
  const days={}; for(let i=6;i>=0;i--) days[dateIso(Date.now()-i*86400000)]=0;
  xp.docs.forEach(d=>{const t=d.data(), k2=dateIso(t.createdAt); if(k2 in days&&t.amount>0) days[k2]+=t.amount;});
  return {u,id:userId,ach:a.docs.map(d=>d.data()).sort((x,y)=>y.unlockedAt-x.unlockedAt),quests:c.size,visits:k.size,
    checkDates:new Set(k.docs.map(d=>d.data().date)),mix,days,rewards:rw.docs.map(d=>d.data()).sort((x,y)=>x.cost-y.cost),
    teams:tm.docs.map(d=>d.data())};
}

    ${own?`<button class="btn small" style="margin-top:10px" onclick="editProfile()">Edit profile</button>`:''}</div>
    <div class="pbadges">
      <div class="pb">${rankBadge(ri.rank,52)}<div><span class="muted">Current rank</span><br><b>${ri.rank.name}</b></div></div>
      <div class="pb">${latest[0]?achSprite(latest[0],52):''}<div><span class="muted">Latest badge</span><br><b>${latest[0]?esc(latest[0].name):'None yet'}</b></div></div>
    </div></div>
  ${u.favorites&&u.favorites.length?`<div class="row" style="margin-top:10px">${u.favorites.map(f=>`<span class="pill rp">${esc(f)}</span>`).join('')}</div>`:''}

  </div>
  <div class="grid g2" style="margin-top:14px">
    ${sec('Check-ins, last 28 days',`<div class="cal">${cal}</div><p class="muted" style="margin-top:8px;font-size:.8rem">Streak ${u.streak||0} day(s) · best ${u.longestStreak||0} · ${p.visits} visit(s) total</p>`)}
    ${sec('XP this week',`<div class="wk">${Object.entries(p.days).map(([d,v])=>`<div><i style="height:${Math.max(4,Math.round(v/maxXp*70))}px"></i><span>${'SMTWTFS'[new Date(d+'T12:00:00Z').getUTCDay()]}</span></div>`).join('')}</div><p class="muted" style="margin-top:8px;font-size:.8rem">${Object.values(p.days).reduce((s,v)=>s+v,0)} XP in the last 7 days</p>`)}
    ${sec('Workout mix',mixRows.length?mixRows.map(([n,v])=>`<div class="mixrow"><span>${esc(n)}</span><div class="bar mini"><div style="width:${Math.round(v/mixTotal*100)}%"></div></div><b>${v}</b></div>`).join(''):'<p class="muted">Complete quests to see your mix.</p>')}
    ${sec('Next reward',next?`<p><b>${esc(next.name)}</b></p><div class="bar"><div style="width:${nextPct}%"></div></div><p class="muted" style="margin-top:6px;font-size:.8rem">${u.rp||0} / ${next.cost} RP</p>`:cheapest?'<p>You can afford every reward in the store.</p>':'<p class="muted">No rewards listed yet.</p>')}
    ${sec('Loyalty stamps',`<div class="stamps">${Array.from({length:12},(_,i)=>`<span class="${i<stamps?'on':''}"></span>`).join('')}</div><p class="muted" style="margin-top:8px;font-size:.8rem">${stamps}/12 toward your next +500 RP bonus</p>`)}
    ${sec('Team-ups',p.teams.length?p.teams.map(t=>`<p style="margin-bottom:4px"><b>${esc(t.name)}</b> <span class="muted">${t.progress||0}/${t.goalTarget} · ${t.status}</span></p>`).join(''):'<p class="muted">Not on a team yet.</p>')}
  </div>
  ${latest.length>1?sec('Recent badges',`<div class="row" style="gap:14px">${latest.map(a=>`<div style="text-align:center">${achSprite(a,44)}<p class="muted" style="font-size:.72rem">${esc(a.name)}</p></div>`).join('')}</div>`).replace('class="card psec"','class="card psec" style="margin-top:14px"'):''}
  ${own?sec('Your referral code',`<div class="row" style="align-items:center"><b style="font-family:var(--font-d);font-size:1.4rem;color:var(--xp)">${esc(u.referralCode||'')}</b><button class="btn small" onclick="copyRef('${esc(u.referralCode||'')}')">Copy</button></div><p class="muted" style="font-size:.8rem;margin-top:4px">Friends who join with this code earn you +100 RP.</p>`).replace('class="card psec"','class="card psec" style="margin-top:14px"'):''}`;
}
function copyRef(c){ (navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject()).then(()=>toast('Referral code copied'),()=>toast('Code: '+c)); }
function editProfile(){
  const u=me, favs=u.favorites||[];
  openModal(`<h3 style="margin-bottom:12px">Edit profile</h3>
  <div class="field"><label>Avatar</label><div class="avpick">${['av1','av2','av3'].map(a=>`<label><input type="radio" name="ep-av" value="${a}" ${avatarFor(u,me.id).endsWith(a+'.png')?'checked':''}><img src="${IMG}${a}.png" alt="Avatar ${a.slice(2)}"></label>`).join('')}</div></div>
  <div class="field"><label>Nickname (shown on leaderboards)</label><input id="ep-nick" maxlength="20" value="${esc(u.nickname||'')}"></div>
  <div class="field"><label>Phone</label><input id="ep-phone" value="${esc(u.phone||'')}"></div>
  <div class="field"><label>Fitness goal</label><select id="ep-goal"><option value="">Not set</option>${GOALS.map(g=>`<option ${u.goal===g?'selected':''}>${g}</option>`).join('')}</select></div>
  <div class="field"><label>Favorite workouts</label><div class="chips">${CATS.map(c=>`<label><input type="checkbox" class="ep-fav" value="${c}" ${favs.includes(c)?'checked':''}><span>${c}</span></label>`).join('')}</div></div>
  <div class="field"><label class="chk"><input type="checkbox" id="ep-hide" ${u.hideOnBoard?'checked':''} style="width:auto"> Hide my name on member leaderboards</label></div>
  <div class="row"><button class="btn primary" onclick="saveProfile()">Save changes</button><button class="btn" onclick="closeModal()">Cancel</button></div>`);
}
async function saveProfile(){
  const av=document.querySelector('input[name=ep-av]:checked');
  const patch={nickname:document.getElementById('ep-nick').value.trim(),phone:document.getElementById('ep-phone').value.trim(),goal:document.getElementById('ep-goal').value,
    favorites:[...document.querySelectorAll('.ep-fav:checked')].map(x=>x.value),hideOnBoard:document.getElementById('ep-hide').checked};
  if(av) patch.avatar=av.value;
  await run(async()=>{
    await api('PATCH','/api/profile',patch); await refreshMe();
    document.getElementById('topAvatar').src=avatarFor(me,me.id);
    closeModal(); toast('Profile saved'); renderProfile();
  });
}
async function renderProfile(){
  await refreshMe();
  const [p,compSnap,redSnap]=await Promise.all([profileData(me.id,me),
    db.collection('completions').where('userId','==',me.id).orderBy('submittedAt','desc').limit(10).get(),
    db.collection('redemptions').where('userId','==',me.id).orderBy('requestedAt','desc').limit(10).get()]);
  const expiry=me.membershipExpiry||(me.membershipStart+30*86400000), ms=membershipStatus(expiry);
  document.getElementById('v-profile').innerHTML=`<h2 style="margin-bottom:12px">Member profile</h2>${profileHTML(p,true)}
  <h3 style="margin:16px 0 8px">Membership</h3><div class="card">
    <span class="pill ${ms.status==='Active'?'ok':ms.status==='Expiring Soon'?'pending':'rej'}">${ms.status}</span>
    <p class="muted" style="margin-top:8px;font-size:.85rem">${ms.status==='Expired'?'Expired '+dateStr(expiry):ms.days+' day(s) remaining · expires '+dateStr(expiry)}</p>
    <p class="muted" style="margin-top:10px;font-size:.8rem">Renew in person at the front desk. Staff extend your membership by 30 days and add a loyalty stamp.</p></div>
  <h3 style="margin:16px 0 8px">Quest history</h3><div class="card">${compSnap.docs.length?compSnap.docs.map(d=>{const c=d.data();return `<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:2px dashed var(--border)"><span style="font-size:.85rem">${dateStr(c.submittedAt)}</span><span class="pill ${c.status==='approved'?'ok':c.status==='rejected'?'rej':'pending'}">${c.status}</span></div>`;}).join(''):'<p class="muted">No history yet.</p>'}</div>
  <h3 style="margin:16px 0 8px">Redemption history</h3><div class="card">${redSnap.docs.length?redSnap.docs.map(d=>{const r=d.data();return `<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:2px dashed var(--border)"><span style="font-size:.85rem">${esc(r.rewardName)}</span><span class="row" style="gap:6px"><span class="pill ${r.status==='approved'?'ok':r.status==='pending'?'pending':'rej'}">${r.status}</span>${r.status==='pending'?`<button class="btn small" onclick="cancelRedemption('${d.id}')">Cancel</button>`:''}</span></div>`;}).join(''):'<p class="muted">No redemptions yet.</p>'}</div>`;
}
async function viewMember(id){
  const d=await db.doc('users/'+id).get(); const p=await profileData(id,d.data());
  openModal(`${profileHTML(p,false)}<button class="btn" style="width:100%;margin-top:14px" onclick="closeModal()">Close</button>`);
}
async function renderMembers(){
  const snap=await db.collection('users').where('role','==','member').get();
  document.getElementById('v-members').innerHTML=`<h2 style="margin-bottom:12px">Members</h2><div class="grid g3">${snap.docs.map(d=>{const u=d.data();return `<div class="card">
    <div class="mhead"><img class="av" src="${avatarFor(u,d.id)}" alt=""><div><p style="font-weight:800">${esc(u.name)}</p><p class="muted" style="font-size:.8rem">${esc(u.email)}</p></div></div>
    <div class="row" style="margin-top:8px;align-items:center"><span class="pill xp">Lvl ${u.level}</span><span class="pill rp">${u.rp} RP</span>${rankChip(u)}</div>
    <p class="muted" style="font-size:.75rem;margin-top:6px">Streak: ${u.streak} · XP: ${u.xp} · Stamps: ${(u.loyaltyStamps||0)%12}/12</p>
    <div class="row" style="margin-top:8px"><button class="btn small" onclick="viewMember('${d.id}')">View profile</button><button class="btn small" data-id="${d.id}" data-name="${esc(u.name)}" onclick="adjustForm(this.dataset.id,this.dataset.name)">Adjust XP/RP</button><button class="btn small" data-id="${d.id}" data-name="${esc(u.name)}" onclick="renewMember(this.dataset.id,this.dataset.name)">Renew +30d</button></div></div>`;}).join('')||'<p class="muted">No members yet.</p>'}</div>`;
}

// ---- LEADERBOARDS (shared by members and staff) ----



function boardControls(fn,range,metric){
  return `<div class="row" style="margin-bottom:12px"><select style="width:auto" onchange="${fn}(this.value,'${metric}')"><option value="today" ${range==='today'?'selected':''}>Today</option><option value="week" ${range==='week'?'selected':''}>This week</option><option value="month" ${range==='month'?'selected':''}>This month</option></select>
  <select style="width:auto" onchange="${fn}('${range}',this.value)"><option value="xp" ${metric==='xp'?'selected':''}>XP earned</option><option value="quests" ${metric==='quests'?'selected':''}>Quests completed</option></select></div>`;
}
function podiumHTML(rows,metric){
  const meds=[IMG+'trophy.png',IMG+'medal2.png',IMG+'medal3.png'];
  const cell=i=>{const r=rows[i]; return r?`<div class="pod p${i+1}"><img class="medal" src="${meds[i]}" alt="Place ${i+1}"><img class="av" src="${avatarFor(r.u,r.userId)}" alt=""><span class="nm">${esc(lbName(r.u,r.userId))}</span><b>${r.val}${metric==='xp'?' XP':' quests'}</b></div>`:`<div class="pod p${i+1}"><img class="medal" src="${meds[i]}" alt="Place ${i+1}"><span class="muted">Open</span></div>`;};
  return `<div class="podium">${cell(1)}${cell(0)}${cell(2)}</div>`;
}
function boardList(rows,metric,highlightId,staff){
  return rows.length?rows.map((r,i)=>`<div class="lbrow${r.userId===highlightId?' me':''}"><span class="pos">#${i+1}</span><span class="who"><img class="av" src="${avatarFor(r.u,r.userId)}" alt=""><span><b>${esc(lbName(r.u,r.userId))}</b><br><span class="muted" style="font-size:.75rem">Lvl ${r.u.level}${staff?' · '+r.u.rp+' RP':''}</span></span></span>${rankChip(r.u)}<b class="val">${r.val}${metric==='xp'?' XP':''}</b></div>`).join(''):'<p class="muted">No activity in this period yet.</p>';
}
async function renderLeaderboard(range='week',metric='xp'){
  let res; try{ res=await api('GET','/api/leaderboard?range='+encodeURIComponent(range)+'&metric='+encodeURIComponent(metric)); }catch(e){ toast(e.message); return; }
  const rows=res.rows;
  document.getElementById('v-leaderboard').innerHTML=`<h2 style="margin-bottom:10px">Leaderboard</h2>${boardControls('renderLeaderboard',range,metric)}${podiumHTML(rows,metric)}<div class="card">${boardList(rows,metric,me.id,false)}</div>`;
}
async function renderStaffLeaderboard(range='month',metric='xp'){
  let res; try{ res=await api('GET','/api/leaderboard?range='+encodeURIComponent(range)+'&metric='+encodeURIComponent(metric)); }catch(e){ toast(e.message); return; }
  const rows=res.rows;
  document.getElementById('v-sleader').innerHTML=`<h2 style="margin-bottom:10px">Member leaderboard</h2>${boardControls('renderStaffLeaderboard',range,metric)}${podiumHTML(rows,metric)}
  <div class="card" style="margin-bottom:14px"><h3>Top 3 rewards</h3><p class="muted" style="margin:4px 0 10px">1st place gets 100 RP, 2nd gets 75 RP, 3rd gets 50 RP. Awarding adds the points to each member's balance, notifies them, and is logged. Each period can be awarded once.</p>
  ${res.awarded?`<span class="pill ok">Awarded ${dateStr(res.awarded.createdAt)}</span>`:`<button class="btn primary" ${rows.length?'':'disabled'} onclick="awardTop3('${range}','${metric}')">Award top ${Math.min(3,rows.length)||3}</button>`}</div>
  <div class="card">${boardList(rows,metric,null,true)}</div>`;
}
async function awardTop3(range,metric){
  await run(async()=>{
    const r=await api('POST','/api/leaderboard/award',{range,metric});
    toast('Top '+r.count+' rewarded'); renderStaffLeaderboard(range,metric);
  }, ()=>renderStaffLeaderboard(range,metric));
}

async function api(method,path,body){
  const opts={method,headers:{'Content-Type':'application/json'}};
  if(token) opts.headers.Authorization='Bearer '+token;
  if(body!==undefined) opts.body=JSON.stringify(body);
  let r;
  try{ r=await fetch(path,opts); }catch(e){ throw new Error('Cannot reach the server — check your connection.'); }
  let j={}; try{ j=await r.json(); }catch(e){}
  if(r.status===401 && token) sessionExpired();
  if(!r.ok) throw new Error(j.error||('Request failed ('+r.status+')'));
  return j;
}
function sessionExpired(){ if(me){ toast('Session expired — please log in again'); logout(); } }
async function run(fn,onError){
  try{ return await fn(); }
  catch(e){ toast((e&&e.message)||'Something went wrong'); if(onError){ try{ await onError(); }catch(_){} } }
}
function applySession(r){ me=r.user; if(r.tz) APP_TZ=r.tz; }
function saveToken(t){ token=t; try{ localStorage.setItem('fq_token',t); }catch(e){} }
async function deleteSeasonal(id){
  await run(async()=>{ await db.doc('seasonal/'+id).delete(); toast('Challenge deleted'); renderSeasonalStaff(); });
}
async function renewMember(userId,name){
  await run(async()=>{
    await api('POST','/api/members/'+userId+'/renew');
    toast('Renewed '+name+': +30 days, +1 stamp'); renderMembers();
  });
}

// Safety net: any action that throws shows a toast instead of failing silently.
window.addEventListener('unhandledrejection',e=>{ toast((e.reason&&e.reason.message)||'Something went wrong'); e.preventDefault(); });
init();
</script>
